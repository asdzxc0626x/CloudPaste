# Cloudflare Workers + Static Assets 一体化部署配置
# 用途：将前端静态资源和后端 API 部署到同一个 Worker
# 使用方式：npx wrangler deploy --config wrangler.spa.toml

name = "cloudpaste-spa"
main = "unified-entry.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# CPU 时间上限（修改点：大仓库备份超 CPU 限制）
# 与 wrangler.toml 保持一致，理由同见该文件的说明：
# 代码仓库备份的一次作业（N 个引用 × M 个目标，各自完整下载 + 上传一遍）
# 跑在同一个 Workflow 步骤里，CPU 累计，默认 30 秒必然不够；
# 超限会直接杀掉 isolate，连失败原因都写不进数据库。
[limits]
cpu_ms = 300000

# 开发服务器配置
[dev]
port = 8787
local_protocol = "http"

# 环境变量
[vars]
# 用于加密敏感配置的密钥
ENCRYPTION_SECRET = "default-encryption-key"
# 管理员Token过期天数，默认7天
ADMIN_TOKEN_EXPIRY_DAYS = "7"
#
# 调试开关（默认 false，不区分大小写）
# - DEBUG_DRIVER_CACHE=true：开启驱动缓存命中日志
# DEBUG_DRIVER_CACHE = "false"
# 代码仓库备份：GitHub 请求调度参数（修改点：第 3 期，均可选，注释掉即用默认值）
# - REPO_BACKUP_GITHUB_MAX_CONCURRENCY：全局并发上限，默认 2
# - REPO_BACKUP_GITHUB_MIN_INTERVAL_MS：相邻请求最小间隔（毫秒），默认 800
# - REPO_BACKUP_GITHUB_HOURLY_BUDGET：无 Token 时的小时预算，默认 45（真实匿名上限为 60）
# REPO_BACKUP_GITHUB_MAX_CONCURRENCY = "2"
# REPO_BACKUP_GITHUB_MIN_INTERVAL_MS = "800"
# REPO_BACKUP_GITHUB_HOURLY_BUDGET = "45"
# 代码仓库备份：单次作业传输预算（修改点：大仓库备份超 CPU 限制，均可选，注释掉即用默认值）
# 作用是在撞上 CPU / 步骤超时之前主动收手，把没轮到的目标留给下一轮补写
# - REPO_BACKUP_SOFT_DEADLINE_MS：软截止（毫秒），Workers 默认 420000（7 分钟，步骤超时 10 分钟留收尾余量）；0 = 不限制
# - REPO_BACKUP_JOB_BYTE_BUDGET_MB：单次作业的累计传输量上限，Workers 默认 2048；0 = 不限制
# - REPO_BACKUP_MAX_ARCHIVE_MB：单个归档体积上限，超过即中断并记永久性失败，Workers 默认 2048；0 = 不限制
# - REPO_BACKUP_STALL_TIMEOUT_MS：传输停滞判定（毫秒），默认 120000，不可关闭
# REPO_BACKUP_SOFT_DEADLINE_MS = "420000"
# REPO_BACKUP_JOB_BYTE_BUDGET_MB = "2048"
# REPO_BACKUP_MAX_ARCHIVE_MB = "2048"
# REPO_BACKUP_STALL_TIMEOUT_MS = "120000"

# 绑定D1数据库
# 需要替换为实际的数据库ID
[[d1_databases]]
binding = "DB"
database_name = "cloudpaste-db"
database_id = "xxxxxxxxxxxxxxxxx"

# Cloudflare Workflows 绑定
# 用于异步任务作业的持久化执行 (支持多任务类型)
[[workflows]]
binding = "JOB_WORKFLOW"
name = "job-workflow"
class_name = "JobWorkflow"

[triggers]
crons = ["*/5 * * * *"]

# ==================== Static Assets 配置 ====================
# 用于托管前端静态资源
[assets]
# 静态资源目录（相对于 backend/ 目录）
directory = "../frontend/dist"

# SPA 模式：前端路由刷新时返回 index.html（避免 404）
not_found_handling = "single-page-application"

# 配置：明确指定这些路径优先进入 Worker 处理
# 防止 API 请求被 SPA fallback 拦截
run_worker_first = ["/api/*", "/dav/*"]

# ==================== 路由优先级说明 ====================
# 1. /api/* 和 /dav/* -> 优先进入 Worker 处理（run_worker_first）
# 2. 静态文件存在 -> 直接返回（不调用 Worker）
# 3. 前端路由（浏览器导航）-> 返回 index.html（SPA fallback）
# 4. 导航请求在 compatibility_date >= 2025-04-01 时不计费
